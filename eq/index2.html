<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background-color: #000000;
      margin: 0;
      overflow: hidden;
    }

    #earth-frame {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      border: 0;
      z-index: 1;
    }

    #splash {
      position: fixed;
      inset: 0;
      z-index: 2;
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.4s ease;
    }

    #splash.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .image-frame {
      position: relative;
      display: inline-flex;
    }

    .image-frame img {
      max-width: 100vw;
      max-height: 100vh;
      width: auto;
      height: auto;
      display: block;
    }

    .image-frame h1 {
      position: absolute;
      top: 0;
      left: 0;
      margin: 0;
      padding: 16px;
      color: #ffffff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
    }
  </style>
</head>
<body>
  <iframe
    id="earth-frame"
    src="https://dinosaurpictures.org/ancient-earth"
    title="Ancient Earth"
    allowfullscreen
  ></iframe>

  <div id="splash">
    <div class="image-frame">
      <img
        id="hero-img"
        src="https://pub-668a574142944ad6bc4a8be9ab4bec9f.r2.dev/geology.jpg"
        alt="Geology"
      >
      <h1>Foundation</h1>
    </div>
  </div>

  <script>
    const img = document.getElementById('hero-img');
    const iframe = document.getElementById('earth-frame');
    const splash = document.getElementById('splash');

    function fitImage() {
      if (!img.naturalWidth || !img.naturalHeight) return;
      const ratio = img.naturalWidth / img.naturalHeight;
      img.style.width = `min(100vw, calc(100vh * ${ratio}))`;
      img.style.height = `min(100vh, calc(100vw / ${ratio}))`;
    }
    img.addEventListener('load', fitImage);
    if (img.complete) fitImage();

    const frameLoaded = new Promise((resolve) => {
      iframe.addEventListener('load', resolve, { once: true });
    });

    // Rejects on offline, DNS, or connection-refused errors so the placeholder stays up
    const serverReachable = fetch(iframe.src, { mode: 'no-cors', cache: 'no-store' });

    Promise.all([frameLoaded, serverReachable])
      .then(() => {
        splash.classList.add('hidden');
        splash.addEventListener('transitionend', () => {
          splash.style.display = 'none';
        }, { once: true });
      })
      .catch(() => {
        // Keep the geology image and "Foundation" overlay visible
      });
  </script>
</body>
</html>
