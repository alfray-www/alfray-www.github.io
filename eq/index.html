<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="30; url=ancient-earth.html">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background-color: #000000;
      margin: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .image-frame {
      position: relative;
      display: inline-flex;
    }

    .image-frame img {
      max-width: 100vw;
      max-height: 100vh;
      width: auto;
      height: auto;
      display: block;
    }

    .image-frame h1 {
      position: absolute;
      top: 0;
      left: 0;
      margin: 0;
      padding: 16px;
      color: #ffffff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
    }
  </style>
</head>
<body>
  <div class="image-frame">
    <img
      id="bg-img"
      src="https://pub-668a574142944ad6bc4a8be9ab4bec9f.r2.dev/geology.jpg"
      alt="Geology"
    >
    <h1>Foundation Earthquake Exhibit</h1>
  </div>

  <script>
    // Ensures the image also scales UP to fill large monitors while keeping
    // the wrapper locked to the image's exact aspect ratio.
    const img = document.getElementById('bg-img');
    function fitImage() {
      if (!img.naturalWidth || !img.naturalHeight) return;
      const ratio = img.naturalWidth / img.naturalHeight;
      img.style.width = `min(100vw, calc(100vh * ${ratio}))`;
      img.style.height = `min(100vh, calc(100vw / ${ratio}))`;
    }
    img.addEventListener('load', fitImage);
    if (img.complete) fitImage();
  </script>
</body>
</html>
